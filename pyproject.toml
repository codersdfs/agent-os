[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "1.0.0"
description = "One repo, a skill-powered agent OS: self-referential skills, a build pipeline that keeps system prompts within budget, and runtime trigger-loading for any AI coding agent."
readme = "README.md"
license = { text = "MIT" }
keywords = ["agent", "skills", "ai-agent", "skill-management", "system-prompt"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools]
# `scripts/` is excluded by setuptools' flat-layout auto-discovery
# (convention dir); pin it so the skill-* entry points import it.
packages = ["scripts"]

[project.scripts]
skill-build = "scripts.build_index:main"
skill-assemble = "scripts.assemble_prompt:main"
skill-list = "scripts.skill_loader:main"
skill-match = "scripts.skill_loader:main"
skill-load = "scripts.skill_loader:main"
skill-auto = "scripts.skill_loader:main"
