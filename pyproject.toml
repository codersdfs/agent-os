[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meta-skill-framework"
version = "1.0.0"
description = "Self-referential meta-skill framework for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
keywords = ["meta-skill", "framework", "ai-agent", "skill-management"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
