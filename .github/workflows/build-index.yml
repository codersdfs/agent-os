name: Build Index

on:
  push:
    paths:
      - 'skills/details/*.md'
  pull_request:
    paths:
      - 'skills/details/*.md'
  workflow_dispatch:

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build skill index
        run: python scripts/build_index.py

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet -- skills/generated/SKILL_INDEX.generated.md; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated index
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add skills/generated/SKILL_INDEX.generated.md
          git commit -m "Auto-build: regenerate SKILL_INDEX.generated.md"
          git push
